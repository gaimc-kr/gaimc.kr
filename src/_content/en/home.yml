ipp:
  title: Global IPP
  text: A field-linked program that the department designs with companies and organizations so that international students can move from study to work experience and employment in Korea. It extends Hansung University's work-study (IPP) experience to global students.
learn:
  - title: AI Management Consulting
    text: Use AI as a tool to diagnose and analyze business problems and to design management innovation projects, including AI transformation (AX) strategies.
  - title: Consulting Methodologies
    text: Build a solid grounding in problem solving, entrepreneurship, venture creation, SME consulting, HRM&D and productivity innovation.
  - title: Field Practice
    text: A research paper and a practicum (field placement) are part of the graduation requirements, so you carry out real consulting work in the field.
  - title: Global Competence
    text: Study in a bilingual (Korean–Vietnamese) track or an English track, and learn ODA consulting methodologies.
  - title: Data and R&D
    text: Learn evidence-based consulting through statistical analysis methodologies and R&D consulting case studies.
partners_text: We design students' study and field experience together with universities in Vietnam and Bangladesh and with organizations and companies in Korea.
faculty_text: Our faculty combine academic research with hands-on industry experience.
