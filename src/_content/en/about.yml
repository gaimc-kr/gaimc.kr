greeting:
  paragraphs:
    - Thank you for visiting the website of the Department of Global AI Management Consulting.
    - Our department took its first step in September 2024, welcoming international students as the Global Management Consulting Major of the Graduate School of Knowledge Service & Consulting, and became the Department of Global AI Management Consulting in March 2026. Students from Vietnam and Bangladesh study together in the Global Management Consulting Major (bilingual track) and the Global AI Management Consulting Major (English track), and our student body is expanding to Nepal, India and beyond.
    - We teach management consulting for the age of AI. We educate consultants who use AI as a tool to diagnose and analyze business problems and who design and carry out management innovation, including AI transformation (AX). The curriculum runs from consulting fundamentals, problem solving, entrepreneurship, venture creation and SME consulting to human resource development, statistical analysis and R&D consulting, and is completed through a research paper and a practicum. Students learn not only knowledge but the mindset and methods of consultants who deliver results in the field.
    - Our faculty, who have experience in both academia and industry, support the growth of every student. Full-time, visiting and adjunct professors, together with guest speakers active in industry, generously share AI management consulting cases and practical know-how.
    - We are growing programs with companies and organizations, including the Global IPP, so that students can move beyond their studies to field experience, employment and work that connects their home countries with Korea. Our partnerships with Hanoi University of Industry, University of South Asia and Shanto-Mariam University of Creative Technology are part of this effort.
    - We welcome everyone who wants to learn in Korea and work around the world. Our department will be a reliable partner on your journey.
  signature_title: Chair, Department of Global AI Management Consulting
  signature_name: Jin-Taek Jung
vision: Field-oriented AI management consulting education that connects global students with industry through AI and consulting
goals:
  - Build consulting competence to diagnose problems and design solutions with AI
  - Develop analytical and advisory skills grounded in data and R&D evidence
  - Develop practical skills through field study and the practicum
  - Develop global communication skills for collaboration in multicultural, multilingual settings
features:
  - title: AI management consulting education
    text: Learn consulting methodologies that use AI and AI transformation (AX) strategies.
  - title: Two majors and tracks
    text: The Global Management Consulting Major (bilingual track) and the Global AI Management Consulting Major (English track).
  - title: Master's program
    text: 30 credits over five semesters (2.5 years).
  - title: Field-linked learning
    text: A research paper and a practicum are graduation requirements, and the Global IPP connects students with companies.
  - title: Experienced faculty
    text: Fourteen faculty members who combine academic research with industry experience.
  - title: Korean-ready students
    text: The bilingual track requires TOPIK Level 3 or higher for admission, so students are ready to study, practice and prepare for work in Korean.
  - title: Growing diversity
    text: Following Vietnam and Bangladesh, our students now also come from Nepal, India and other countries.
history:
  - period: Sep 2024
    text: Began recruiting international students as the Global Management Consulting Major of the Graduate School of Knowledge Service & Consulting; first cohort admitted
    count: 87 (Vietnam)
  - period: Mar 2025
    text: Second cohort admitted
    count: 63 (Vietnam)
  - period: Sep 2025
    text: Third cohort admitted
    count: 95 (Vietnam)
  - period: Mar 2026
    text: Became the Department of Global AI Management Consulting (from major to department); fourth cohort admitted
    count: 145 (Vietnam 91, Bangladesh 54)
  - period: Aug 2026
    text: Held the Korea–Vietnam Global AI Business Industry-Academia Joint Seminar (Aug 6–7) and the Bangladesh–Korea Global AI Business Joint Seminar (Aug 18)
    count: ""
  - period: Sep 2026
    text: Fifth cohort admitted
    count: 73 (Vietnam 7, Bangladesh 66)
history_note: Students are admitted every March and September.
