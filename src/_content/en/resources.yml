intro: "Brochures are PDFs and promotional videos are MP4s; all may be shared freely for promoting and introducing the department."
groups:
  - title: Department promotional video
    type: video
    text: "The department's official promotional video, introducing Global AI Management Consulting in about one minute. Available in Korean, English and Vietnamese, it covers the department and its faculty, a curriculum built around AI consulting agent modules, industry field learning, cooperation with Hanoi University of Industry in Vietnam, student academic seminars and our growing student community. All activity scenes are photos from the department's own events. Watch it here or download it to share at admission sessions, events and on social media."
    items:
      - lang_label: 한국어 (Korean)
        lang: ko
        cover: /images/resources/promo-ko.jpg
        video: /files/videos/gaimc-promo-ko.mp4
        files:
