preparing_text: Details of the Global IPP program are being prepared and will be posted here once confirmed.
intro: The Global IPP is a field-linked program that the department designs with companies and organizations so that international students can move from study to work experience and employment in Korea.
blocks:
  - title: How it works
    text: Students, the department, partner companies and organizations, and guest speakers run the program together.
  - title: Career support
    text: Special lectures, company consultations, practicum (field placement) and career counseling support students' careers.
  - title: Relationship with Hansung IPP
    text: Builds on Hansung University's work-study (IPP) experience and extends it to international students.
experts_text: Guest speakers from industry and academia take part in the Global IPP.
