preparing_text: Nội dung chi tiết của chương trình Global IPP đang được chuẩn bị và sẽ được đăng tại đây khi hoàn tất.
intro: Global IPP là chương trình gắn kết thực tế do khoa thiết kế cùng doanh nghiệp và tổ chức, giúp sinh viên quốc tế đi từ học tập đến trải nghiệm thực tế và việc làm tại Hàn Quốc.
blocks:
  - title: Cơ cấu vận hành
    text: Sinh viên, khoa, doanh nghiệp và tổ chức hợp tác cùng các diễn giả khách mời cùng vận hành chương trình.
  - title: Hỗ trợ nghề nghiệp
    text: Hỗ trợ sinh viên qua các bài giảng chuyên đề, tư vấn với doanh nghiệp, thực tập (practicum) và tư vấn việc làm.
  - title: Quan hệ với IPP của Đại học Hansung
    text: Dựa trên kinh nghiệm vừa học vừa làm (IPP) của Đại học Hansung và mở rộng cho sinh viên quốc tế.
experts_text: Các diễn giả khách mời từ doanh nghiệp và học thuật cùng tham gia Global IPP.
