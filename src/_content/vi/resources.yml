intro: "Brochure ở định dạng PDF, video giới thiệu ở định dạng MP4; có thể chia sẻ tự do nhằm quảng bá và giới thiệu khoa."
groups:
  - title: Video giới thiệu khoa
    type: video
    text: "Video giới thiệu chính thức của khoa, giới thiệu Khoa Tư vấn Quản trị AI Toàn cầu trong khoảng một phút. Video có ba phiên bản tiếng Hàn, tiếng Anh và tiếng Việt, giới thiệu khoa và đội ngũ giảng viên, chương trình học xây dựng quanh các mô-đun AI agent tư vấn, hoạt động thực tế tại doanh nghiệp, hợp tác với Đại học Công nghiệp Hà Nội, hội thảo học thuật của sinh viên và cộng đồng sinh viên cùng phát triển. Các cảnh hoạt động đều là hình ảnh thực tế từ sự kiện của khoa. Hãy xem trực tiếp hoặc tải về để sử dụng tại buổi tư vấn tuyển sinh, sự kiện và mạng xã hội."
