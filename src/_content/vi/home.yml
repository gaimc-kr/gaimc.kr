ipp:
  title: Global IPP
  text: Chương trình gắn kết thực tế do khoa thiết kế cùng doanh nghiệp và tổ chức, giúp sinh viên quốc tế đi từ học tập đến trải nghiệm thực tế và việc làm tại Hàn Quốc. Chương trình mở rộng kinh nghiệm vừa học vừa làm (IPP) của Đại học Hansung cho sinh viên quốc tế.
learn:
  - title: Tư vấn quản trị AI
    text: Sử dụng AI làm công cụ để chẩn đoán, phân tích vấn đề của doanh nghiệp và thiết kế các dự án đổi mới quản trị, bao gồm chiến lược chuyển đổi AI (AX).
  - title: Phương pháp tư vấn
    text: Học có hệ thống các phương pháp tư vấn về giải quyết vấn đề, tinh thần khởi nghiệp, khởi nghiệp mạo hiểm, tiếp cận doanh nghiệp vừa và nhỏ, HRM&D và đổi mới năng suất.
  - title: Thực hành tại doanh nghiệp
    text: Bài nghiên cứu và thực tập (practicum) là điều kiện tốt nghiệp, giúp sinh viên trực tiếp thực hiện tư vấn tại doanh nghiệp.
  - title: Năng lực toàn cầu
    text: Học trong chương trình song ngữ (Hàn – Việt) hoặc chương trình tiếng Anh, và học phương pháp tư vấn ODA.
  - title: Dữ liệu và R&D
    text: Học tư vấn dựa trên bằng chứng qua phương pháp phân tích thống kê và nghiên cứu tình huống tư vấn R&D.
partners_text: Chúng tôi thiết kế quá trình học tập và trải nghiệm thực tế của sinh viên cùng các trường đại học tại Việt Nam, Bangladesh và các tổ chức, doanh nghiệp tại Hàn Quốc.
faculty_text: Đội ngũ giảng viên kết hợp nghiên cứu học thuật với kinh nghiệm thực tiễn tại doanh nghiệp.
