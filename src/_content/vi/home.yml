hero:
  eyebrow: HANSUNG UNIVERSITY · GRADUATE SCHOOL
  title: Đào tạo chuyên gia tư vấn quản trị toàn cầu trong kỷ nguyên AI
  subtitle: Khoa Tư vấn Quản trị AI Toàn cầu, Đại học Hansung đào tạo thạc sĩ Chuyên ngành Tư vấn Quản trị Toàn cầu (chương trình song ngữ) và Chuyên ngành Tư vấn Quản trị AI Toàn cầu (chương trình tiếng Anh). Sinh viên học phương pháp tư vấn ứng dụng AI cùng với thực hành tại doanh nghiệp.
