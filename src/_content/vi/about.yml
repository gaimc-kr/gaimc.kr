greeting:
  paragraphs:
    - Xin chân thành cảm ơn quý vị đã ghé thăm trang web của Khoa Tư vấn Quản trị AI Toàn cầu.
    - Khoa bắt đầu từ tháng 9 năm 2024, khi tiếp nhận sinh viên quốc tế với tư cách là Chuyên ngành Tư vấn Quản trị Toàn cầu thuộc Trường Sau đại học Dịch vụ Tri thức & Tư vấn, và được nâng cấp thành Khoa Tư vấn Quản trị AI Toàn cầu vào tháng 3 năm 2026. Hiện khoa đang chuẩn bị cho bước phát triển mới khi trực thuộc Trường Sau đại học Hội tụ Toàn cầu, khai giảng vào tháng 3 năm 2027. Sinh viên Việt Nam và Bangladesh đang cùng học tại Chuyên ngành Tư vấn Quản trị Toàn cầu (chương trình song ngữ) và Chuyên ngành Tư vấn Quản trị AI Toàn cầu (chương trình tiếng Anh), và quốc tịch sinh viên đang mở rộng sang Nepal, Ấn Độ và các nước khác.
    - Khoa giảng dạy tư vấn quản trị trong kỷ nguyên AI. Chúng tôi đào tạo những chuyên gia tư vấn sử dụng AI làm công cụ để chẩn đoán, phân tích vấn đề của doanh nghiệp, thiết kế và thực hiện các dự án đổi mới quản trị, bao gồm chuyển đổi AI (AX). Chương trình đi từ nhập môn tư vấn, giải quyết vấn đề, tinh thần khởi nghiệp, khởi nghiệp mạo hiểm, tiếp cận doanh nghiệp vừa và nhỏ đến phát triển nguồn nhân lực, phân tích thống kê và tư vấn R&D, và được hoàn thiện bằng bài nghiên cứu và thực tập. Sinh viên không chỉ học kiến thức mà còn học tư duy và phương pháp của nhà tư vấn tạo ra kết quả thực tế.
    - Đội ngũ giảng viên có kinh nghiệm cả học thuật lẫn thực tiễn luôn đồng hành cùng sự phát triển của từng sinh viên. Các giảng viên cơ hữu, thỉnh giảng, kiêm nhiệm cùng các diễn giả khách mời đang làm việc tại doanh nghiệp sẵn sàng chia sẻ tình huống tư vấn quản trị AI và kinh nghiệm thực tiễn.
    - Khoa đang phát triển các chương trình kết nối với doanh nghiệp và tổ chức, trong đó có Global IPP, để sinh viên không dừng lại ở việc học mà tiến tới trải nghiệm thực tế, việc làm và cả những công việc kết nối quê hương với Hàn Quốc. Hợp tác với Đại học Công nghiệp Hà Nội, University of South Asia và Shanto-Mariam University of Creative Technology là một phần của nỗ lực đó.
    - Chúng tôi chào đón tất cả những ai muốn học tại Hàn Quốc và làm việc trên toàn thế giới. Khoa sẽ là người bạn đồng hành đáng tin cậy trên hành trình của bạn.
  signature_title: Trưởng khoa Tư vấn Quản trị AI Toàn cầu
  signature_name: Jung Jin-Taek
vision: Giáo dục tư vấn quản trị AI gắn với thực tiễn, kết nối sinh viên quốc tế với doanh nghiệp thông qua AI và tư vấn
goals:
  - Phát triển năng lực phương pháp tư vấn để chẩn đoán vấn đề và thiết kế giải pháp bằng AI
  - Phát triển năng lực phân tích và đề xuất dựa trên dữ liệu và bằng chứng R&D
  - Phát triển năng lực thực hành qua học tập thực tế và thực tập (practicum)
  - Phát triển năng lực giao tiếp toàn cầu để hợp tác trong môi trường đa văn hóa, đa ngôn ngữ
features:
  - title: Giáo dục tư vấn quản trị AI
    text: Học phương pháp tư vấn ứng dụng AI và chiến lược chuyển đổi AI (AX).
  - title: Hai chuyên ngành
    text: Chuyên ngành Tư vấn Quản trị Toàn cầu (chương trình song ngữ) và Chuyên ngành Tư vấn Quản trị AI Toàn cầu (chương trình tiếng Anh).
  - title: Chương trình thạc sĩ
    text: 30 tín chỉ trong 5 học kỳ (2,5 năm).
  - title: Gắn kết thực tế
    text: Bài nghiên cứu và thực tập là điều kiện tốt nghiệp, và Global IPP kết nối sinh viên với doanh nghiệp.
  - title: Đội ngũ giảng viên giàu kinh nghiệm
    text: 14 giảng viên kết hợp nghiên cứu học thuật và kinh nghiệm thực tiễn tại doanh nghiệp.
  - title: Sinh viên có năng lực tiếng Hàn
    text: Chương trình song ngữ yêu cầu TOPIK cấp 3 trở lên khi nhập học, nên sinh viên có thể học, thực tập và chuẩn bị việc làm bằng tiếng Hàn.
  - title: Quốc tịch ngày càng đa dạng
    text: Sau Việt Nam và Bangladesh, sinh viên đang đến từ Nepal, Ấn Độ và nhiều nước khác.
