memo: 2026. 10. 16. 학과장 요청으로 개설. 브로셔 원본은 드라이브 '학과브로셔' 폴더(2026. 10. 15. PDF 6개, 편집용 pptx 3개). 브로셔가 바뀌면 같은 파일 이름으로 교체. 2026. 10. 16. 학과장 지시로 3면(글로벌 IPP) 수정본으로 교체 — 운영 원칙 '취업 알선 비용 없음' → '겸임교수 현장 연계', 겸임교수 중심 현장 연계(소개·STEP 1·2·운영 주체·기업 발굴·매칭) 반영
