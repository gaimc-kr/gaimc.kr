intro: "브로셔는 PDF, 홍보 영상은 MP4 파일이며, 학과 홍보와 안내 목적으로 자유롭게 배포할 수 있습니다."
groups:
  - title: 학과 홍보 영상
    type: video
    text: "글로벌AI경영컨설팅학과를 1분여에 소개하는 학과 공식 홍보 영상입니다. 한국어·영어·베트남어 세 가지로 만들었으며, 학과 소개와 교수진, AI 컨설팅 에이전트 모듈로 배우는 교육과정, 산업 현장학습, 베트남 하노이산업대학교와의 협력, 학생 학술세미나, 함께 성장하는 학생 공동체를 담았습니다. 학과 활동 장면은 모두 현장에서 찍은 사진입니다. 화면에서 바로 보시거나 내려받아 입학설명회, 행사, SNS 등에 자유롭게 활용해 주세요."
