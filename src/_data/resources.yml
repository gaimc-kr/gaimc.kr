    text: 학과 소개, 교육과정, 글로벌 IPP, 교수진, 협력 기관을 4면에 담은 학과 브로셔입니다. 화면으로 보거나 메일로 보낼 때는 A4 4면 보기용을, 인쇄해 배포할 때는 A3 양면 인쇄용(A3 용지에 양면 인쇄한 뒤 반으로 접기)을 받으세요.
