memo: 2026. 10. 16. 학과장 요청으로 개설. 2026. 11. 7. 학과장 요청으로 학과 홍보 영상 3차본(국·영·베, 드라이브 홈페이지/홍보영상 폴더) 추가, 같은 날 4차본으로 교체(3번째 장면 신협전자 단체사진, AI 컨설팅 에이전트 모듈 도식 장면 추가, 마지막 장면 남이섬 세미나 단체사진, 에이전트 장면은 움직이는 그래픽으로 교체, 산업 AI EXPO 장면은 2일차 킨텍스 입구 전체 단체사진) — 사진은 학과 활동 사진, 배경음악은 자체 합성 음원, 내레이션은 Microsoft Edge 신경망 음성. 브로셔 원본은 드라이브 '학과브로셔' 폴더(2026. 10. 15. PDF 6개, 편집용 pptx 3개). 브로셔가 바뀌면 같은 파일 이름으로 교체. 2026. 10. 16. 학과장 지시로 3면(글로벌 IPP) 수정본으로 교체 — 운영 원칙 '취업 알선 비용 없음' → '겸임교수 현장 연계', 겸임교수 중심 현장 연계(소개·STEP 1·2·운영 주체·기업 발굴·매칭) 반영
