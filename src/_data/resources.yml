memo: 2026. 10. 16. 학과장 요청으로 개설. 2026. 11. 16. 학과장 요청으로 「D-2 → E-7 구직활동 설명회 자료」 묶음을 맨 위에 추가(드라이브 글로벌IPP_취업/홈페이지 자료실 게시용 PDF 6개 + 설명회 학생 안내자료의 참여 기업 미리보기 국·베·영, 영문 파일명으로 복사, 기업 조건 공개는 학과장 결정). 11. 30. 마감 후 '모집 마감' 표시·신청 링크 제거 예정. 2026. 11. 18. 학과장 요청으로 「유학생 취업 서류 양식」 묶음 추가(드라이브 제반 양식 폴더 최종본 — 베트남 학생용 신규양식 이력서·자기소개서, 방글라데시 학생용 Form1·Form2. 교과목명은 공식 개설강좌 명칭으로 수정 — 영문 이력서 01·05·11·13·14번, 국문 이력서 06~08·12·13·15번 과목명. PDF는 LibreOffice 변환. 추천서·현장면접 확인서는 내부 서식이라 비게재). 2026. 11. 7. 학과장 요청으로 학과 홍보 영상 3차본(국·영·베, 드라이브 홈페이지/홍보영상 폴더) 추가, 같은 날 4차본으로 교체. 2026. 11. 10. 학과장 요청으로 세로형 쇼츠 3종(드라이브 홍보영상 폴더 Hansung_GlobalAI_Promo_KO·EN·VI, 1080×1920 → 720×1280 변환) 추가, 같은 날 학과장 확인 최종본(HSU 로고·자막 수정)으로 교체(3번째 장면 신협전자 단체사진, AI 컨설팅 에이전트 모듈 도식 장면 추가, 마지막 장면 남이섬 세미나 단체사진, 에이전트 장면은 움직이는 그래픽으로 교체, 산업 AI EXPO 장면은 2일차 킨텍스 입구 전체 단체사진, 2026. 11. 11. 학술세미나 장면을 6월 AI Art & Business Festival 전체 단체사진과 해당 자막·나레이션(배운 것을 작품으로)으로 교체) — 사진은 학과 활동 사진, 배경음악은 자체 합성 음원, 내레이션은 Microsoft Edge 신경망 음성. 브로셔 원본은 드라이브 '학과브로셔' 폴더(2026. 10. 15. PDF 6개, 편집용 pptx 3개). 브로셔가 바뀌면 같은 파일 이름으로 교체. 2026. 11. 16. 특강연사 수를 15명으로 고쳐 PDF 6개 교체(편집용 pptx는 미반영). 교과목명은 공식 개설강좌 명칭 유지(같은 날 AI 교과명 일괄 변경본은 학과장 지시로 철회). 2026. 10. 16. 학과장 지시로 3면(글로벌 IPP) 수정본으로 교체 — 운영 원칙 '취업 알선 비용 없음' → '겸임교수 현장 연계', 겸임교수 중심 현장 연계(소개·STEP 1·2·운영 주체·기업 발굴·매칭) 반영
