ipp:
  title: 글로벌 IPP
  text: 유학생이 학업과 현장 경험, 국내 취업으로 이어지도록 기업·기관과 함께 설계하는 학과의 현장 연계 프로그램입니다. 한성대학교의 일학습병행(IPP) 경험을 글로벌 학생으로 확장합니다.
  memo: 글로벌 IPP 정제 후 문구 교체

learn:
  - title: AI 경영컨설팅
    text: 인공지능을 도구로 기업의 문제를 진단·분석하고, AI 전환(AX) 전략을 포함한 경영 혁신 과제를 설계하는 방법을 배웁니다.
    memo: 교과 반영 문구 확인
  - title: 컨설팅 방법론
    text: 문제해결, 기업가정신, 벤처창업, 중소기업 접근, HRM&D, 생산성혁신 등 컨설팅 방법론을 체계적으로 배웁니다.
  - title: 현장 실무
    text: 졸업 요건에 소논문과 프랙티컴(현장 실습)이 포함되어 현장에서 컨설팅을 수행해 봅니다.
  - title: 글로벌 역량
    text: 이중언어과정(한국어·베트남어)과 영어트랙과정으로 운영하며, ODA 컨설팅 방법론을 다룹니다.
  - title: 데이터와 R&D
    text: 통계분석 컨설팅 방법론과 R&D 컨설팅 사례연구로 근거 있는 컨설팅을 익힙니다.

partners_text: 베트남과 방글라데시의 대학, 국내 기관·기업과 함께 학생의 학업과 현장 경험을 설계합니다.
faculty_text: 학술 연구와 산업 현장 경험을 겸비한 교수진이 함께합니다.

