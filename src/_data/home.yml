# 메인 페이지 문구와 수치
hero:
  eyebrow: HANSUNG UNIVERSITY · GRADUATE SCHOOL
  title: AI 시대의 글로벌 경영컨설턴트를 길러냅니다
  subtitle: 한성대학교 글로벌AI경영컨설팅학과는 글로벌경영컨설팅전공(이중언어과정)과 글로벌AI경영컨설팅전공(영어트랙과정)을 운영하는 석사과정입니다. AI를 활용한 경영컨설팅 방법론과 현장 실무를 함께 익힙니다.

