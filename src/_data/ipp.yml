# 글로벌 IPP (/ipp/) — 「글로벌 IPP 추진 현황 및 실행 계획」(2026. 10. 8.) 보고서 기준으로 공개 가능한 범위만 게재
# 게재 제외: 졸업반 대상 인원·전공 분포·단계별 목표 인원, 수요기업·채용·비자 목표치, 본부 협조 요청, 재원, 비자 세부 절차, 기업 검증 기준
preparing: false
preparing_text: 글로벌 IPP 프로그램의 세부 내용은 준비 중이며, 확정되는 대로 이 페이지에 안내합니다.
intro: "글로벌 IPP는 유학생이 학업(Off-JT), 현장 경험(OJT), 국내 취업(채용 전환)으로 이어지도록 학과가 기업·기관과 함께 설계하고 직접 운영하는 현장 연계 체계입니다. 별도의 취업 프로그램이 아니라 교육, 학생 관리, 진로 지원을 하나의 흐름으로 묶는 학과 운영의 틀입니다."
background: "2024년 9월 외국인 유학생 모집을 시작한 이래 학과는 글로벌 IPP를 운영 방향으로 삼아 왔습니다. 한성대학교 일학습병행(IPP)의 운영 경험을 벤치마킹하되, 운영은 학과가 교수진과 연구원 체제로 맡습니다. 지역특화형 비자 등 유학생의 지역 취업·정주를 뒷받침하는 정책 환경이 넓어지고 있어, 학과는 이러한 환경을 유학생의 진로 설계에 연결하고자 합니다."
structure_text: "한성대학교 일학습병행(IPP)의 교육 → 현장 → 채용 전환 3단 구조를 대학원 유학생에게 적용했습니다."
compare:
  - item: 대상
    hansung: 국내 학부 3·4학년
    global: 석사과정 유학생(졸업반 우선)
  - item: Off-JT(교육)
    hansung: 교내 직무 훈련
    global: 정규 교육과정, 실무 교육, 특강
  - item: OJT(현장)
    hansung: 협약 기업 현장 훈련
    global: 기업 상담, 현장 실습(프랙티컴), 기업 방문
  - item: 채용 전환
    hansung: 학습기업 정규직 전환
    global: 매칭 면접과 채용, 졸업 후 체류자격 전환 지원
  - item: 운영 주체
    hansung: IPP사업단
    global: 학과(교수진·연구원)
stages:
  - name: 준비단계
    period: 2026년 1학기
    status: done
    text: 교육 체계 정비, 학생 포트폴리오 확보, 해외 협약대학과 국내 기관 네트워크 구축
  - name: 실행단계
    period: 2026년 2학기
    status: active
    text: 현장 접점, 기업 발굴, 매칭과 채용, 졸업 후 정주 지원
  - name: 확장단계
    period: 2027년 이후
    status: vision
    text: 제도화, 외부 사업 연계, 협약대학과 모집 국가 확대
done:
  - title: 정규 교육과정
    text: "5학기 30학점 과정에 AI 경영컨설팅, 컨설팅 방법론, 데이터·R&D 컨설팅, 글로벌 역량(이중언어·영어트랙) 과목을 편성하고, 소논문과 프랙티컴을 졸업 요건으로 운영합니다."
  - title: AI 비즈니스 자동화 실무 교육
    text: "AI 에이전트와 노코드 자동화 실습으로 기업에 설명할 수 있는 직무 역량을 익힙니다."
  - title: 2026 AI Art & Business Festival
    text: "6월 24~29일, 인사동 마루아트센터. 다국적 유학생의 AI 창작·비즈니스 교육과 작품 전시로 학생 포트폴리오를 확보하고 기관 접점을 넓혔습니다."
    event: ai-art-business-festival
  - title: 한국-베트남 공동 세미나
    text: "8월 6~7일, 하노이산업대학교. 협약대학과 입학·진로 경로를 함께 안내할 기반을 마련했습니다."
    event: korea-vietnam-seminar
  - title: 방글라데시-한국 공동 세미나
    text: "8월 18일, 다카. University of South Asia, Shanto-Mariam University of Creative Technology와 협력 기반을 넓혔습니다."
    event: bangladesh-korea-seminar
  - title: 운영 기반
    text: "교수진 14명, 특강연사 20명, 국적별 전담 연구원 2명, 협력 기관 16곳(해외 5·국내 11), 3개 언어 학과 홈페이지를 갖추었습니다."
steps:
  - title: 진단
    text: "희망 학생의 한국어 수준, 전공, 희망 지역과 직무를 확인해 개인별 진로 경로를 정합니다."
  - title: 준비
    text: "성적표의 공식 과목명을 바탕으로 이력서와 자기소개서를 표준화하고 한·영 프로필을 만듭니다. 한국어 보완 학습을 병행합니다."
  - title: 현장 접점
    text: "2026 산업AI EXPO 단체 참관과 기업 상담(10월 21~23일, 킨텍스) 등에서 학생이 직접 기업을 만나고 상담 결과를 발표합니다."
    event: industrial-ai-expo
  - title: 기업 발굴
    text: "테크노파크, 산업단지공단, 상공회의소 등 지역 기관과 협력해 유학생 채용 수요가 있는 기업을 찾고, 근로조건을 확인한 기업만 소개합니다."
  - title: 매칭·채용
    text: "기업 방문 미팅과 매칭 면접을 거쳐 근로계약 조건을 점검합니다."
  - title: 정주 지원
    text: "졸업 전후 체류자격 전환에 필요한 절차를 안내하고, 입사와 정착을 확인합니다."
principles:
  - title: 교육이 중심
    text: "취업은 정규 교육의 결과물로 설계합니다. 재학 중 활동은 학사 일정과 체류자격이 허용하는 범위 안에서 진행합니다."
  - title: 1인 1프로필 관리
    text: "출석, 성적, 한국어 수준, 희망 직무를 한곳에 모아 관리하고, 국적별 전담 연구원과 학년별 담당 교수가 학생을 살핍니다."
  - title: 학생 동의 기반
    text: "기업 매칭과 정보 제공은 학생의 동의를 받아 진행하며, 개인정보 제공 이력을 기록합니다."
  - title: 비용 없음
    text: "학과는 학생과 기업 어느 쪽에서도 취업 알선 대가를 받지 않습니다."
  - title: 검증된 기업
    text: "고용 안정성과 근로조건을 확인한 기업만 학생에게 소개합니다."
  - title: 역할 구분
    text: "학과는 교육, 연계, 안내를 맡습니다. 비자 신청 등 법적 절차는 학생과 기업이 전문가 자문을 받아 진행합니다."
team:
  - role: 학과
    text: 기획·운영·성과 관리, 기업·기관과의 대외 협의
  - role: 대학원장
    text: 대외 기관 면담 동행, 대학원 차원의 지원
  - role: 교수진
    text: 이력서 검증, 기업 추천, 현장 면접과 행사 인솔, 학년별 학생 담당
  - role: 연구원 2명
    text: 베트남·방글라데시 학생 전담 관리와 행정 지원
  - role: 특강연사 20명
    text: 산업 현장 특강과 기업 소개
  - role: 협력 기관
    text: 해외 협약대학(입학·진로 연계), 국내 기업·기관(현장 접점과 기업 발굴), 지역 기관(테크노파크·산업단지공단·상공회의소·지자체)
  - role: 한성대학교 IPP사업단
    text: 일학습병행 운영 경험 벤치마킹
future:
  - title: 제도화
    text: 대상을 넓히고 지자체·기관과의 협력을 제도화합니다. 수요기업과 학생 관리 체계를 정비합니다.
    when: 2027년
  - title: 외부 사업 연계
    text: 지자체와 정부의 유학생 취업·정주 지원 사업 참여를 검토합니다.
    when: 2027~2028년
  - title: 협약대학과 모집 국가 확대
    text: 하노이산업대학교, University of South Asia, Shanto-Mariam University of Creative Technology와 송출 단계부터 졸업 후 진로를 함께 안내하고, 2027학년도부터 네팔·인도로 모집을 확대합니다.
    when: 2027년
  - title: IPP 연계
    text: 한성대학교 IPP사업단과 대학원 유학생 트랙 연계를 논의합니다.
    when: 2027년
  - title: 공동 운영
    text: 다른 대학과의 공동 운영과 수요기업 정보 공유를 검토합니다.
    when: 2028년
benefits:
  - who: 유학생
    text: 졸업 후 합법적인 취업·정주 경로를 설계하고, 표준화된 프로필로 직무 역량을 보여줄 수 있습니다.
  - who: 기업
    text: 학업과 체류가 검증된 석사급 인재를 사전 상담을 거쳐 만날 수 있습니다.
  - who: 지역
    text: 지역 기업의 인력 수요와 유학생의 정주를 연결합니다.
  - who: 한성대학교
    text: 졸업 후 진로가 보이는 대학원으로 신입 유학생 유치와 산학관 네트워크를 넓힙니다.
experts_text: 산업 현장과 학계의 특강연사들이 글로벌 IPP에 함께합니다.
status_note: 본 내용은 2026년 10월 기준 추진 현황이며, 실행 결과와 세부 계획은 확정되는 대로 갱신합니다.
memo: >-
  2026. 10. 8. 「글로벌 IPP 추진 현황 및 실행 계획」(드라이브 '글로벌IPP' 폴더) 기준 공개 범위 반영. 실행단계 결과(2027. 2. 보고 예정) 확정 후 성과 갱신.
  운영 기반 수치(교수진·특강연사·연구원·협력 기관)는 메인 '한눈에 보는 학과'와 맞출 것. 산업AI EXPO 종료 후 '현장 접점' 문구를 결과형으로 수정.
