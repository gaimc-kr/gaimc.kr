# 글로벌 IPP (/ipp/) — 정제 중. 구체 수치, 비자·취업 전략, 목표 인원은 확정 전까지 게재하지 않음
preparing: true
preparing_text: 글로벌 IPP 프로그램의 세부 내용은 준비 중이며, 확정되는 대로 이 페이지에 안내합니다.
intro: 글로벌 IPP는 유학생이 학업과 현장 경험, 국내 취업으로 이어지도록 학과가 기업·기관과 함께 설계하는 현장 연계 프로그램입니다.
blocks:
  - title: 운영 구조
    text: 학생, 학과, 협력 기업·기관, 특강연사가 함께 프로그램을 운영합니다.
  - title: 학생 경력 지원
    text: 특강, 기업 상담, 현장 실습(프랙티컴), 취업 상담으로 학생의 경력을 지원합니다.
  - title: 한성대 IPP와의 관계
    text: 한성대학교의 일학습병행(IPP) 경험을 기반으로 글로벌 학생으로 확장합니다.
experts_text: 산업 현장과 학계의 특강연사들이 글로벌 IPP에 함께합니다.
memo: 정제 후 문구 교체, 운영 구조도 확정, 참여 기업·기관(협약 체결 또는 참여 확정)과 성과(확정된 사례만) 추가
