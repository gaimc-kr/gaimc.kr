# 교육과정 (/courses/)
# 과목별 학기와 학기별 학점은 게재하지 않음(총 30학점만 표기)
intro: 두 개의 전공을 병렬로 운영하며, 15개 주요 교과목을 영역별로 소개합니다. 교육과정은 학교 모집요강과 개설강좌에 따라 바뀔 수 있습니다.
memo: 2027학년도 학과 모집요강 공고 시 대조. 컨설팅조사연구(2학점) 추가 편성 여부, 이중언어과정 AI 명칭 개편 여부, ODA 분반 담당(임성욱) 확인

tracks:
  - name: 글로벌경영컨설팅전공
    course_type: 이중언어과정
    language: 한국어, 베트남어
    degree: 석사
    duration: 2.5년(5학기)
    graduation: 총 30학점, 소논문(논문대체실적)과 프랙티컴, 종합시험 합격
    korean: 한국어 프로그램 300시간 이수, 한국어능력시험(TOPIK) 3급 이상(4급 권장)
  - name: 글로벌AI경영컨설팅전공
    course_type: 영어트랙과정
    language: 영어(일부 과목 영어·한국어)
    degree: 석사
    duration: 2.5년(5학기)
    graduation: 총 30학점, 소논문(논문대체실적)과 프랙티컴, 종합시험 합격
    korean: ""
    memo: 한국어 요건 미기재. 확인 후 입력

notes:
  - 소논문은 기본 언어가 한국어이며 지도교수와 협의해 한국어 또는 영어를 선택할 수 있습니다.
  - 졸업 요건을 충족하지 못하면 추가 학기 등록이 필요할 수 있습니다.
  - 영어트랙과정의 일부 교과목은 과목명에 AI가 붙습니다(예 글로벌 AI 컨설팅 개론).

areas:
  - 입문·언어
  - 컨설팅 방법론
  - 인사·조직·직무
  - 데이터·R&D·마케팅
  - 연구

