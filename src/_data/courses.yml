career: 글로벌 IPP를 통해 졸업과 취업 준비를 연계하여, 컨설팅 기업, 기업의 사업·인사·해외 부서, 공공기관과 국제협력 분야 등으로 진로를 준비합니다.
career_memo: 졸업생 진로 실적은 첫 졸업생 배출 후 사실 위주로 게재
