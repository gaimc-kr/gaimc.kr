vision: AI와 컨설팅으로 글로벌 학생과 산업 현장을 연결하는 현장형 AI 경영컨설팅 교육
goals:
  - AI를 활용해 문제를 진단하고 해법을 설계하는 컨설팅 방법론 역량 함양
  - 데이터와 R&D 근거에 기반한 분석·제안 능력 함양
  - 현장학습과 프랙티컴을 통한 실무 수행 능력 함양
  - 다문화·다언어 환경에서 협업하는 글로벌 소통 역량 함양
goals_memo: 학과 공식 교육목표가 별도로 있으면 그 문구로 교체

features:
  - title: AI 경영컨설팅 교육
    text: AI를 활용한 컨설팅 방법론과 AI 전환(AX) 전략을 배웁니다.
  - title: 두 개의 전공과 과정
    text: 글로벌경영컨설팅전공(이중언어과정)과 글로벌AI경영컨설팅전공(영어트랙과정)을 운영합니다.
  - title: 석사과정
    text: 5학기(2.5년) 동안 총 30학점을 이수합니다.
  - title: 현장 연계
    text: 졸업 요건에 소논문과 프랙티컴이 포함되며, 글로벌 IPP로 기업과 연계합니다.
  - title: 겸비한 교수진
    text: 학술 연구와 산업 현장 경험을 함께 갖춘 교수진 14명이 함께합니다.
  - title: 한국어 능력을 갖춘 학생
    text: 이중언어과정은 한국어능력시험(TOPIK) 3급 이상을 입학 자격으로 하여, 한국어로 수업·실습·취업 준비가 가능한 학생이 모입니다.
    memo: 영어트랙과정 적용 여부 확인
  - title: 확대되는 국적
    text: 베트남, 방글라데시에 이어 네팔, 인도 등으로 학생의 국적이 넓어지고 있습니다.

