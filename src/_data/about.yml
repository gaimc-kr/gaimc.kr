# 학과 소개 (/about/)
greeting:
  paragraphs:
    - 글로벌AI경영컨설팅학과 홈페이지를 찾아 주신 여러분께 진심으로 감사드립니다.
    - 우리 학과는 2024년 9월 지식서비스&컨설팅대학원의 글로벌경영컨설팅전공으로 외국인 학생을 맞이하며 첫걸음을 뗐고, 2026년 3월 글로벌AI경영컨설팅학과로 승격되었습니다. 2027년 3월 개강하는 글로벌융합대학원 소속으로 새로운 도약을 준비하고 있습니다. 지금은 글로벌경영컨설팅전공(이중언어과정)과 글로벌AI경영컨설팅전공(영어트랙과정)에서 베트남과 방글라데시의 학생들이 함께 공부하고 있으며, 네팔과 인도 등으로 학생의 국적이 넓어지고 있습니다.
    - 우리 학과는 AI 시대의 경영컨설팅을 가르칩니다. 인공지능을 도구로 삼아 기업의 문제를 진단하고 분석하며, AI 전환(AX)을 포함한 경영 혁신 과제를 설계하고 실행하는 컨설턴트를 길러냅니다. 컨설팅 개론과 문제해결, 기업가정신, 벤처창업, 중소기업 접근, 인적자원개발, 통계분석, R&D 컨설팅에 이르는 교육과정을 소논문과 프랙티컴(현장 실습)으로 완성하며, 지식에 그치지 않고 현장에서 실행하는 경영컨설턴트의 사고방식과 방법론을 익힙니다.
    - 학문과 현장을 함께 경험한 교수진이 학생 한 사람 한 사람의 성장을 곁에서 돕습니다. 전임교수와 초빙·겸임·강의초청교수, 그리고 산업 현장에서 활동하는 특강 연사들이 AI 경영컨설팅 사례와 실무 노하우를 아낌없이 나눕니다.
    - 우리는 학생이 학업에서 멈추지 않고 현장 경험과 취업, 나아가 모국과 한국을 연결하는 일로 나아가도록 글로벌 IPP를 비롯한 기업·기관 연계 프로그램을 키워 가고 있습니다. 하노이산업대학교, University of South Asia, Shanto-Mariam University of Creative Technology와 맺은 협력도 그 일부입니다.
    - 한국에서 배우고 세계에서 일하고자 하는 여러분의 도전을 환영합니다. 우리 학과가 그 여정의 든든한 동반자가 되겠습니다.
