# 입학안내 (/admission/)
# details_published: 학교 공식 모집요강 공고(10월 중순) 후 수치를 대조하고 true로 변경
# fees_published: 2027학년도 전형료·등록금·장학금 확인 후 true로 변경
details_published: false
fees_published: false
basis: 2027학년도 전기정시 입시 계획(2026. 10. 1. 승인)과 2026학년도 전기정시 외국인유학생 전담학과 모집요강 기준
notice: 본 안내는 요약이며 정확한 내용은 한성대학교 공식 모집요강을 따릅니다.
pending_text: 2027학년도 전기 신입생 모집 안내는 학교 공식 모집요강 공고(2026년 10월 중순) 후 이 페이지에 게재합니다. 그 전에는 한성대학교 대학원 홈페이지의 공지를 확인해 주십시오.

overview:
  - label: 모집 학과
    value: 글로벌융합대학원 글로벌AI경영컨설팅학과(외국인유학생 전담학과)
  - label: 모집 전공
    value: 글로벌경영컨설팅전공(이중언어과정), 글로벌AI경영컨설팅전공(영어트랙과정)
  - label: 모집 인원
    value: 100명(두 전공 합산)
  - label: 입학 시기
    value: 2027년 3월(전기). 입학은 매년 3월과 9월에 합니다.
  - label: 모집 시기
    value: 정시에만 모집하며 수시모집은 하지 않습니다.
  - label: 모집 단위
    value: 전공이 아닌 학과 단위로 모집합니다.
overview_memo: 전공·과정 명칭은 2026 전기 요강 기준. 입시 계획에는 "다언어과정"으로 표기되어 있어 2027 요강 공고 시 대조

schedule_title: 2027학년도 전기정시 일정
schedule:
  - item: 원서접수
    date: 2026. 10. 14.(수) 10:00 ~ 10. 26.(월) 17:00
    note: 유웨이어플라이 인터넷 접수
  - item: 면접고사
    date: 2026. 11. 14.(토) 10:00
    note: 대면 면접 원칙, 해외 거주 등 불가피한 경우 비대면 면접 가능
  - item: 합격자 발표·등록금 고지
    date: 2026. 12. 1.(화) 16:00 예정
    note: 대학원 홈페이지 안내
  - item: 합격자 등록
    date: 2026. 12. 4.(금) ~ 12. 10.(목) 23:00
    note: 기업은행 개인별 가상계좌 납부
  - item: 예비합격자 등록
    date: ~ 2026. 12. 14.(월)
    note: ""

eligibility:
  - label: 국적
    value: 지원자와 부모의 국적이 모두 외국인인 자(이중국적자 제외)
  - label: 학력
    value: 국내·외 정규 대학에서 학사학위를 취득한 자 또는 취득 예정자
  - label: 한국어(글로벌경영컨설팅전공, 이중언어과정)
    value: 한국어능력시험(TOPIK) 3급 이상
  - label: 영어(글로벌AI경영컨설팅전공, 영어트랙과정)
    value: TOEFL iBT 59점, IELTS 5.5, CEFR B2, TEPS 600점(NEW TEPS 202점) 이상 중 하나(2026학년도 기준)
eligibility_highlight: 이중언어과정은 TOPIK 3급 이상을 입학 자격으로 하여, 한국어로 수업과 현장 실습, 취업 준비가 가능한 학생이 모입니다.
eligibility_memo: 영어트랙과정의 TOPIK 3급 적용 여부, 2027 영어 기준 확인

selection:
  - 서류심사와 면접으로 선발하며 면접점수 100%로 사정합니다.
  - 평가 요소는 학업계획, 성적, 연구 의지와 연구성과, 언어능력, 학업능력입니다.
  - 면접점수 평균 60점 미만이거나 면접에 결시하면 불합격입니다.
  - 지원자의 학업능력이 부적격으로 판단되면 모집인원과 관계없이 선발하지 않을 수 있습니다.

fees_title: 전형료, 등록금, 장학금(2026학년도 기준)
fees:
  - item: 전형료
    value: 85,000원
  - item: 입학금
    value: 100만 원(첫 학기)
  - item: 등록금
    value: 학기당 400만 원
  - item: 입학 장학
    value: 수업료의 70% 이내, 첫 학기
  - item: 성적 장학
    value: 수업료 30% 이내, 직전 학기 성적 상위 10% 이내
  - item: 한국어능력 장학
    value: 수업료 30% 이내, 입학 전 TOPIK 미취득자 중 TOPIK 3급 취득자(최초 1회)

documents:
  - title: 공통
    text: 입학원서, 증명사진, 졸업(예정)증명서, 성적증명서, 본인 및 부모 여권 사본, 가족관계증명서, 재정능력입증서류(잔액 USD 17,000 또는 2,000만 원 이상), 자기소개서, 서약서. 선택 서류는 외국인등록증 사본, 추천서(최대 2장)입니다.
  - title: 외국 대학 졸업자 추가
    text: 인가대학 확인서, 학력조회동의서, 출신 대학 웹페이지 출력본
  - title: 공증
    text: 외국 서류는 공증과 번역공증이 필요하며 국가별 아포스티유·영사확인 방법이 다릅니다. 세부 내용은 학교 공식 모집요강을 확인해 주십시오.
